[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Today's static-check scope; legacy modules require a separate cleanup.
include = ["app/validation.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["app/validation.py"]
strict = true
