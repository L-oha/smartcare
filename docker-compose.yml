services:
  smartcare:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET: ${APP_SECRET:?Copy .env.example to .env and set APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/smartcare.db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    volumes:
      - smartcare_data:/data
volumes:
  smartcare_data:
